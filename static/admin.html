<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Administration</title>
<style>
:root{--bg:#fff1f4;--card:#fffafb;--tx:#3b1d27;--mu:#8c6671;--ac:#d6457a;--ln:#f2c9d5;--ok:#2e8b57}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}.btn{background:var(--ac);color:#fff;border:0;padding:.6em 1.1em;min-height:42px;border-radius:99px;cursor:pointer;font-weight:600;transition:.2s;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.o{background:none;border:1px solid var(--ac);color:var(--ac)}.btn.s{padding:.25em .85em;min-height:34px;font-size:.85em}.btn.r{background:#b3261e}.btn.o.r{background:none;color:#b3261e;border-color:#b3261e}
nav{display:flex;gap:.4em;overflow-x:auto;padding:.6em 4%;padding-top:max(.6em,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:20;scrollbar-width:none;align-items:center}nav::-webkit-scrollbar{display:none}
nav b{margin-right:auto;font-size:1.1em;flex:none;padding-right:.6em}nav button{flex:none;background:none;border:1px solid var(--ln);padding:.4em 1em;min-height:40px;border-radius:99px;cursor:pointer}nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:920px;margin:auto;padding:1em 4% 4em}.c{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:1em;margin:.8em 0}
.f{display:grid;gap:.6em}.f input:not([type=checkbox]):not([type=file]),.f select,.f textarea{width:100%;padding:.65em;min-height:44px;border:1px solid var(--ln);border-radius:10px;background:#fff;font-size:16px}
.f label small{display:block;margin-bottom:.15em}small{color:var(--mu)}.row{display:flex;justify-content:space-between;align-items:center;gap:.6em;flex-wrap:wrap}.gap{display:flex;gap:.4em;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.6em}.tile{border:1px solid var(--ln);border-radius:12px;padding:.4em;background:#fff;display:flex;flex-direction:column;gap:.35em}.tile img,.tile video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#eee}.tile .btn{width:100%}.tile i{font-style:normal;font-size:.75em;color:var(--ac);font-weight:700}
.st{padding:.1em .7em;border-radius:9px;background:var(--ln);font-size:.85em;white-space:nowrap}.hint{background:#fff;border-left:4px solid var(--ac);padding:.5em .8em;border-radius:6px;font-size:.9em;margin:.5em 0}
h3{margin:.1em 0 .5em}.pi{display:flex;gap:.7em;align-items:center;min-width:0}.pi img{width:52px;height:52px;object-fit:cover;border-radius:10px;flex:none;background:#eee}.pi div{min-width:0}.pi b{overflow-wrap:anywhere}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6em}.kp div{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:.7em}.kp b{display:block;font-size:1.3em;color:var(--ac)}.kp small{font-size:.8em}
.ch{display:flex;align-items:flex-end;gap:3px;height:110px;margin:.4em 0}.ch div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}.lb{display:flex;gap:3px;font-size:.62em;color:var(--mu)}.lb span{flex:1;text-align:center;overflow:hidden}
#pg{position:fixed;left:50%;bottom:1em;transform:translateX(-50%);background:var(--tx);color:#fff;padding:.6em 1.2em;border-radius:99px;z-index:50;display:none;max-width:90vw}
@media(max-width:600px){.row.stack{flex-direction:column;align-items:stretch}.tiles{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="lg" style="max-width:340px;margin:18vh auto;padding:1em"><h2>Espace vendeuse</h2><div class="f" style="margin-top:1em"><input id="pw" type="password" placeholder="Mot de passe" autocomplete="current-password" onkeydown="event.key=='Enter'&&go()"><button class="btn" onclick="go()">Entrer</button></div></div>
<div id="app" hidden><nav><b>Administration</b><button onclick="tab('o')" id="to">Commandes</button><button onclick="tab('p')" id="tp">Articles</button><button onclick="tab('s')" id="ts">Ma boutique</button><button onclick="tab('v')" id="tv">Statistiques</button><button onclick="tab('x')" id="tx">Sécurité</button><a href="/" target="_blank"><button>Voir le site</button></a></nav><main id="mn"></main></div><div id="pg"></div>
<script>
let D,T="o",cur,$=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TH=u=>/\/[0-9a-f]{16}\.(webp|mp4|webm)$/.test(u)?u.replace(/\.(webp|mp4|webm)$/,"_t.webp"):u,isV=u=>/\.(mp4|webm)$/i.test(u);
const api=async(p,b)=>{const r=await fetch("/api/admin/"+p,b?{method:"POST",body:JSON.stringify(b)}:{});if(r.status==401){location.reload();return}const d=await r.json();if(!r.ok){alert(d.error);return}return d};
const fm=n=>Number(n).toLocaleString("fr-FR")+" "+D.settings.currency;
function pgm(t){const e=$("pg");e.textContent=t;e.style.display=t?"block":"none"}
async function go(){const r=await fetch("/api/login",{method:"POST",body:JSON.stringify({password:$("pw").value})});if(r.ok)load();else alert((await r.json()).error)}
async function load(){D=await api("data");if(!D)return;$("lg").hidden=true;$("app").hidden=false;tab(T)}
async function reload(){D=await api("data")}
/* ---- envoi optimisé : images réduites en WebP + miniature ; vidéos avec image d'aperçu ---- */
function xup(blob,q){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open("POST","/api/admin/upload"+(q||""));x.upload.onprogress=e=>e.lengthComputable&&pgm("Envoi… "+Math.round(e.loaded/e.total*100)+" %");
 x.onload=()=>{try{const d=JSON.parse(x.responseText);x.status==200?res(d.url):rej(d.error||"Erreur")}catch(e){rej("Erreur serveur")}};x.onerror=()=>rej("Réseau indisponible");x.send(blob)})}
async function enc(file,max,q){const b=await createImageBitmap(file),s=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(b.width*s));c.height=Math.max(1,Math.round(b.height*s));c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/webp",q))}
async function upImg(f,o={}){try{let full=await enc(f,o.max||1600,.82);if(!full||full.type!="image/webp")full=f;const url=await xup(full);
 if(o.thumb!==false&&full.type=="image/webp"){const m=url.match(/\/([0-9a-f]{16})\.webp$/),t=await enc(f,560,.78);if(m&&t&&t.type=="image/webp")try{await xup(t,"?name="+m[1])}catch(e){}}return url}catch(e){throw typeof e=="string"?e:"Image non prise en charge (utilisez JPG, PNG ou WEBP)."}finally{pgm("")}}
async function poster(f){const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=URL.createObjectURL(f);await new Promise((r,j)=>{v.onloadeddata=r;v.onerror=j;setTimeout(j,6000)});v.currentTime=Math.min(.5,(v.duration||1)/2);await new Promise(r=>{v.onseeked=r;setTimeout(r,2500)});
 const s=Math.min(1,560/Math.max(v.videoWidth||1,1)),c=document.createElement("canvas");c.width=Math.round(v.videoWidth*s)||320;c.height=Math.round(v.videoHeight*s)||180;c.getContext("2d").drawImage(v,0,0,c.width,c.height);URL.revokeObjectURL(v.src);return new Promise(r=>c.toBlob(r,"image/webp",.78))}
async function upVid(f){if(f.size>50e6)throw"Vidéo trop lourde (50 Mo maximum). Compressez-la avant l'envoi.";try{const url=await xup(f),m=url.match(/\/([0-9a-f]{16})\.(mp4|webm)$/);if(m)try{const p=await poster(f);if(p&&p.type=="image/webp")await xup(p,"?name="+m[1])}catch(e){}return url}finally{pgm("")}}
function tab(t){T=t;["o","p","s","v","x"].forEach(k=>$("t"+k).classList.toggle("on",k==t));({o:ord,p:prd,s:shop,v:stats,x:sec})[t]()}
/* ---- commandes ---- */
let OF="";
function ord(){const l={"en attente":"Nouvelle commande","en livraison":"En livraison","livrée":"Livrée (vente confirmée)","annulée":"Annulée"},L=D.orders.filter(o=>!OF||o.status==OF);
 $("mn").innerHTML=`<div class="hint">1. Nouvelle commande : appelez le client puis « Lancer la livraison ». 2. Le client reçoit le colis et saisit son code : la vente devient définitive et son reçu est créé.</div>
 <div class="f"><select onchange="OF=this.value;ord()"><option value="">Toutes les commandes (${D.orders.length})</option>${Object.keys(l).map(k=>`<option value="${k}" ${OF==k?"selected":""}>${l[k]}</option>`).join("")}</select></div>`+(L.map(o=>`<div class="c"><div class="row"><b>#${o.id} — ${esc(o.name)}</b><span class="st">${l[o.status]}</span></div>
 <small>${esc(o.created)} · ${esc(o.phone)} · ${esc(o.address)}</small>${JSON.parse(o.items).map(i=>`<div>${esc(i.name)} × ${i.qty} <small>(${fm(i.price*i.qty)})</small></div>`).join("")}<div class="row" style="margin-top:.4em"><span><b>${fm(o.total)}</b> <small>Code : ${esc(o.code)}</small></span>
 <span class="gap">${o.status=="en attente"?`<button class="btn s" onclick="os(${o.id},'en livraison')">Lancer la livraison</button>`:""}${o.status=="en attente"||o.status=="en livraison"?`<button class="btn o s" onclick="os(${o.id},'annulée')">Annuler</button>`:""}<a href="https://wa.me/${esc(o.phone.replace(/\D/g,""))}" target="_blank"><button class="btn o s">WhatsApp</button></a>${o.status=="annulée"?`<button class="btn o r s" onclick="osd(${o.id})">Supprimer</button>`:""}</span></div></div>`).join("")||"<p>Aucune commande.</p>")}
async function os(id,status){if(status=="annulée"&&!confirm("Annuler cette commande ?"))return;await api("order",{id,status});await reload();ord()}
async function osd(id){if(confirm("Supprimer définitivement cette commande annulée ?")){await api("order",{id,status:"supprimer"});await reload();ord()}}
/* ---- articles ---- */
function prd(){$("mn").innerHTML=`<button class="btn" onclick="ed()">+ Nouvel article</button>`+(D.products.map(p=>`<div class="c row stack"><div class="pi"><img src="${esc(TH(p.images[0]||""))}" alt=""><div><b>${esc(p.name)}</b><br><small>${esc(p.cat)} · ${fm(p.price)} · stock ${p.stock}${p.visible?"":" · masqué"} · ${p.images.length} photo(s), ${p.videos.length} vidéo(s)</small></div></div>
 <span class="gap"><button class="btn o s" onclick="ed(${p.id})">Modifier</button><button class="btn o r s" onclick="dl(${p.id})">Supprimer</button></span></div>`).join("")||"<p>Aucun article.</p>")}
function ed(id){cur=id?JSON.parse(JSON.stringify(D.products.find(p=>p.id==id))):{name:"",cat:D.settings.cats[0]||"",price:0,desc:"",images:[],videos:[],details:"",stock:1,visible:1};
 $("mn").innerHTML=`<div class="c f"><h3>${id?"Modifier l'article":"Nouvel article"}</h3><label><small>Nom</small><input id="a1" value="${esc(cur.name)}" maxlength="80"></label><label><small>Catégorie</small><select id="a2">${D.settings.cats.map(c=>`<option ${c==cur.cat?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
 <label><small>Prix (${esc(D.settings.currency)})</small><input id="a3" type="number" min="0" inputmode="numeric" value="${cur.price}"></label><label><small>Quantité en stock</small><input id="a4" type="number" min="0" inputmode="numeric" value="${cur.stock}"></label>
 <label><small>Description courte</small><textarea id="a5" rows="3" maxlength="800">${esc(cur.desc)}</textarea></label>
 <label><small>Détails (une ligne par caractéristique)</small><textarea id="a7" rows="5" placeholder="Matière : plaqué or&#10;Taille : réglable&#10;Entretien : éviter l'eau">${esc(cur.details)}</textarea></label>
 <label><input type="checkbox" id="a6" ${cur.visible?"checked":""}> Visible sur le site</label>
 <div class="hint">Photos : la première est la photo principale (grande). Les autres s'affichent en dessous pour voir les détails. Elles sont réduites et optimisées automatiquement à l'envoi.</div><div class="tiles" id="im"></div>
 <label class="btn o" style="cursor:pointer">+ Ajouter des photos<input type="file" accept="image/*" multiple hidden onchange="addi(this.files)"></label>
 <div class="hint">Vidéos (MP4 ou WEBM, 50 Mo maximum, 6 au plus).</div><div class="tiles" id="vd"></div>
 <label class="btn o" style="cursor:pointer">+ Ajouter une vidéo<input type="file" accept="video/mp4,video/webm" hidden onchange="addv(this.files)"></label>
 <div class="gap"><button class="btn" onclick="sp()">Enregistrer</button><button class="btn o" onclick="prd()">Retour</button>${id?`<button class="btn o r" onclick="dl(${id})">Supprimer l'article</button>`:""}</div></div>`;ri();rv()}
function ri(){$("im").innerHTML=cur.images.map((u,i)=>`<div class="tile"><img src="${esc(TH(u))}" alt="">${i==0?"<i>★ Photo principale</i>":`<button class="btn o s" onclick="mp(${i})">★ Principale</button>`}
 <label class="btn o s" style="cursor:pointer">Remplacer<input type="file" accept="image/*" hidden onchange="rpi(${i},this.files[0])"></label><button class="btn o r s" onclick="cur.images.splice(${i},1);ri()">Supprimer</button></div>`).join("")}
function rv(){$("vd").innerHTML=cur.videos.map((u,i)=>`<div class="tile"><video src="${esc(u)}" poster="${esc(TH(u))}" muted playsinline preload="metadata"></video><label class="btn o s" style="cursor:pointer">Remplacer<input type="file" accept="video/mp4,video/webm" hidden onchange="rpv(${i},this.files[0])"></label><button class="btn o r s" onclick="cur.videos.splice(${i},1);rv()">Supprimer</button></div>`).join("")}
function mp(i){cur.images.unshift(...cur.images.splice(i,1));ri()}
async function addi(fs){for(const f of fs){try{cur.images.push(await upImg(f));ri()}catch(e){alert(e)}}}
async function rpi(i,f){if(!f)return;try{cur.images[i]=await upImg(f);ri()}catch(e){alert(e)}}
async function addv(fs){for(const f of fs){if(cur.videos.length>=6){alert("6 vidéos au maximum.");break}try{cur.videos.push(await upVid(f));rv()}catch(e){alert(e)}}}
async function rpv(i,f){if(!f)return;try{cur.videos[i]=await upVid(f);rv()}catch(e){alert(e)}}
async function sp(){if(!$("a1").value.trim())return alert("Donnez un nom à l'article.");const r=await api("product",{id:cur.id,name:$("a1").value,cat:$("a2").value,price:$("a3").value,stock:$("a4").value,desc:$("a5").value,details:$("a7").value,visible:$("a6").checked,images:cur.images,videos:cur.videos});if(r){await reload();prd()}}
async function dl(id){if(confirm("Supprimer cet article et ses photos et vidéos ? Cette action est définitive.")){await api("delete",{id});await reload();prd()}}
/* ---- ma boutique ---- */
function shop(){const s=D.settings;$("mn").innerHTML=`<div class="c f"><h3>Informations</h3>${[["title","Nom de la boutique"],["tagline","Phrase d'accroche (page d'accueil)"],["footer","Phrase d'accroche du pied de page"],["whatsapp","WhatsApp (chiffres, avec l'indicatif. Ex : 22965685659)"],["instagram","Instagram (nom d'utilisateur)"],["tiktok","TikTok (nom d'utilisateur)"]].map(([k,l])=>`<label><small>${l}</small><input id="s_${k}" value="${esc(s[k])}" maxlength="160"></label>`).join("")}
 <label><small>Catégories (séparées par une virgule)</small><input id="s_cats" value="${esc(s.cats.join(", "))}"></label></div>
 <div class="c"><h3>Logos</h3><div class="hint">Le logo d'ouverture passe en premier sur la page d'accueil. Le logo principal est aussi dans la barre du haut et le pied de page. Ils forment aussi le fond animé. Image PNG à fond transparent conseillée.</div>
 ${[["logo_intro","Logo d'ouverture (1er)"],["logo","Logo principal (barre du haut)"]].map(([k,l])=>`<div class="row" style="margin:.6em 0"><span class="pi"><img id="p_${k}" ${s[k]?`src="${esc(s[k])}"`:""} style="background:#222;object-fit:contain" alt=""><b>${l}</b></span><span class="gap"><label class="btn o s" style="cursor:pointer">Changer<input type="file" accept="image/*" hidden onchange="sone('${k}',this.files[0])"></label><button class="btn o r s" onclick="sdel('${k}')">Supprimer</button></span></div>`).join("")}</div>
 <button class="btn" onclick="ss()">Enregistrer les modifications</button>`}
async function sone(k,f){if(!f)return;try{const u=await upImg(f,{max:900,thumb:false});D.settings[k]=u;$("p_"+k).src=u}catch(e){alert(e)}}
function sdel(k){if(confirm("Retirer cette image du site ? (Cliquez ensuite sur Enregistrer)")){D.settings[k]="";$("p_"+k).removeAttribute("src")}}
async function ss(){const b={cats:$("s_cats").value.split(","),logo:D.settings.logo,logo_intro:D.settings.logo_intro};["title","tagline","footer","whatsapp","instagram","tiktok"].forEach(k=>b[k]=$("s_"+k).value);b.whatsapp=b.whatsapp.replace(/\D/g,"");if(await api("settings",b)){await reload();alert("Enregistré ✓");shop()}}
/* ---- statistiques ---- */
async function stats(){const s=await api("stats");if(!s)return;const f=n=>Number(n).toLocaleString("fr-FR")+" "+D.settings.currency,ch=(t,k,fn)=>{const m=Math.max(1,...s.daily.map(d=>d[k]));return`<div class="c"><h3>${t}</h3><div class="ch">${s.daily.map(d=>`<div style="height:${Math.max(2,d[k]/m*100)}%" title="${d.day} : ${fn?fn(d[k]):d[k]}"></div>`).join("")}</div><div class="lb">${s.daily.map(d=>`<span>${d.day.slice(8)}</span>`).join("")}</div></div>`};
 $("mn").innerHTML=`<div class="c"><h3>Ventes</h3><div class="kp"><div><b>${f(s.ca)}</b><small>Chiffre d'affaires (ventes confirmées par le client)</small></div><div><b>${f(s.ca_month)}</b><small>Ce mois-ci</small></div><div><b>${f(s.pending)}</b><small>Ventes à venir (commandes en cours)</small></div><div><b>${f(s.basket)}</b><small>Panier moyen</small></div></div></div>
 <div class="c"><h3>Commandes</h3><div class="kp"><div><b>${s.orders_total}</b><small>Total</small></div><div><b>${s.counts["en attente"]}</b><small>En attente</small></div><div><b>${s.counts["en livraison"]}</b><small>En livraison</small></div><div><b>${s.counts["livrée"]}</b><small>Livrées</small></div><div><b>${s.counts["annulée"]}</b><small>Annulées</small></div></div></div>
 <div class="c"><h3>Visites</h3><div class="kp"><div><b>${s.visits_today}</b><small>Aujourd'hui</small></div><div><b>${s.visits30}</b><small>30 derniers jours</small></div><div><b>${s.conv} %</b><small>Commandes pour 100 visites</small></div></div></div>
 ${ch("Chiffre d'affaires par jour (14 jours)","ca",f)}${ch("Commandes par jour","orders")}${ch("Visites par jour","visits")}
 <div class="c"><h3>Articles les plus vendus</h3>${s.top.map(t=>`<div class="row"><span>${esc(t[0])}</span><span><b>${t[1]}</b> vendu(s) · ${f(t[2])}</span></div>`).join("")||"<small>Aucune vente confirmée pour l'instant.</small>"}</div>
 <div class="c"><h3>Stock bas (2 ou moins)</h3>${s.low.map(t=>`<div class="row"><span>${esc(t.name)}</span><b>${t.stock}</b></div>`).join("")||"<small>Aucun article en stock bas.</small>"}</div>`}
/* ---- sécurité ---- */
function sec(){$("mn").innerHTML=`<div class="c f"><h3>Changer le mot de passe</h3><input id="np" type="password" placeholder="Nouveau mot de passe (10 caractères minimum)" autocomplete="new-password"><button class="btn" onclick="pwd()">Changer</button></div><div class="c"><h3>Session</h3><button class="btn o" onclick="out()">Me déconnecter</button></div>`}
async function pwd(){const r=await api("password",{password:$("np").value});if(r){alert("Mot de passe changé ✓ Les autres appareils sont déconnectés.");$("np").value=""}}
async function out(){await api("logout",{});location.reload()}
</script></body></html>
